- id: SURV-05.stalkerware_families
  vector: SURV-05
  title: Consumer stalkerware / spouseware SDK markers
  description: |
    Vendor / SDK marker strings for commercial phone-monitoring ("stalkerware") families such as
    mSpy, FlexiSPY, Cocospy, Hoverwatch, TheTruthSpy, Spyzie, KidsGuard, uMobix, XNSPY, Mobistealth,
    iKeyMonitor, Spyera, WebWatcher, Spyic, Minspy, Neatspy and ClevGuard. These exfiltrate messages,
    location, call logs and keystrokes to a vendor panel.
  severity: high
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)\b(mspy|flexispy|flexi_?spy|cocospy|hoverwatch|thetruthspy|the_?truth_?spy|spyzie|kidsguard|umobix|xnspy|mobistealth|ikeymonitor|spyera|webwatcher|spyic|minspy|neatspy|clevguard|spyhuman|mobile_?tracker_?free|hellospy|spy24)\b'
  references:
    - https://stopstalkerware.org/
    - https://www.eff.org/issues/stalkerware

- id: SURV-05.stalkerware_domains
  vector: SURV-05
  title: Consumer stalkerware panel / C2 domains
  description: |
    Hard-coded upload/panel domains for commercial stalkerware families, the endpoint the
    monitored data is exfiltrated to.
  severity: high
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)(mspyonline\.com|thetruthspy\.com|flexispy\.com|cocospy\.com|hoverwatch\.com|umobix\.com|xnspy\.com|mobistealth\.com|ikeymonitor\.com|spyera\.com|clevguard\.(com|net)|spyic\.com|minspy\.com|neatspy\.com|api\.mspy\.|wpanel\.thetruthspy)'

- id: SURV-05.stalkerware_capabilities
  vector: SURV-05
  title: Covert monitoring capability markers
  description: |
    Covert-monitoring capability strings characteristic of stalkerware even when the vendor name is
    stripped, hidden-icon install, silent call recording, keylog upload and remote-command panels.
    Corroborated (two independent markers) to avoid firing on legitimate MDM/parental controls.
  severity: high
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)\b(hide_?app_?icon|stealth_?mode|invisible_?mode|keylog(ger|_upload)?|call_?record(er|ing)_?secret|whatsapp_?spy|sms_?tracker|ambient_?recording|remote_?camera_?capture)\b'

- id: SURV-05.triangulation_triangledb
  vector: SURV-05
  title: Operation Triangulation / TriangleDB artefacts
  description: |
    Operation Triangulation (TriangleDB implant), strings, the `BackupAgent`
    process marker and C2 domains documented by Kaspersky Securelist.
  severity: critical
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)\b(triangledb|triangle_?db|operation_?triangulation)\b'
    - kind: string
      pattern: '(backuprabbit\.com|cloudsponcer\.com|growthtransport\.com|unlimitedteacher\.com)'
  references:
    - https://securelist.com/operation-triangulation-the-last-hardware-mystery/111669/
