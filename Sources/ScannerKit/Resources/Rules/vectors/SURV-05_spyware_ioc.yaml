- id: SURV-05.pegasus_nso_strings
  vector: SURV-05
  title: NSO Pegasus / generic spyware artefacts
  description: |
    Strings / file paths historically tied to NSO Pegasus loaders, drop chains,
    BLASTPASS and HOMAGE deliveries. Source: Citizen Lab.
  severity: critical
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: 'com\.apple\.WebKit\.workaround|/private/var/db/com\.apple\.xpc\.roleaccountd\.staging|pkd\.staging|/var/db/com\.apple\.appstored/staging|XML-Bastion|p[a-z]{0,3}bridgehead|gatekeeperd-spy|tmp/.+nsopf|com\.apple\.private\.security\.bridgehead'

- id: SURV-05.predator_intellexa
  vector: SURV-05
  title: Intellexa Predator artefacts
  description: |
    Predator (Intellexa / Cytrox), strings, drop paths, C2 indicators tied to public
    Citizen Lab / Google TAG writeups.
  severity: critical
  maswe: [MASWE-0048]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)\b(intellexa|cytrox|predator_?loader|alien_?implant|cytrox_?inject)\b'

