- id: TRK-02.xmode
  vector: TRK-02
  title: X-Mode / Outlogic location broker
  description: |
    X-Mode (rebranded Outlogic) sells precise location data to defense / commercial buyers.
    Banned from Google Play and named in FTC actions.
  severity: medium
  maswe: [MASWE-0068]
  mastg: []
  search:
    - kind: string
      pattern: '(?i)\b(xmode|x_-?mode|outlogic|xmode\.io|xmodeapi)\b'
    - kind: frameworkName
      pattern: 'XMode|Outlogic'

