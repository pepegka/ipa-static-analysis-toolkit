- id: TRK-01.session_replay_sdk
  vector: TRK-01
  title: Session-replay SDK linked
  description: |
    A session-replay SDK, or a vendor's dedicated session-replay module, is
    embedded. These record what the user sees and taps so the session can be
    replayed later. App Review Guideline 2.5.14 requires explicit consent and a
    clear indication when an app records user activity. Matched by framework
    name, because the vendor domains sit in FairPlay-encrypted code; a linked SDK
    may still be switched off or masking the screen.
  user_advice: |
    Session recording is the app's own analytics, so the Allow Apps to Request
    to Track switch does not stop it. Look for an analytics or session-recording
    opt-out in the app's privacy settings; a filtering DNS profile that blocks
    the vendor's upload hosts keeps recordings from leaving the device.
  severity: medium
  tracker_ids: [fullstory, logrocket, quantummetric, smartlook, glassbox, uxcam, contentsquare, mouseflow]
  maswe: []
  mastg: []
  search:
    - kind: frameworkName
      pattern: '^(FullStory|FullStoryCapture|LogRocket|logrocket_flutter|QuantumMetric|QuantumMetric_SDK|quantum_metric|Smartlook|SmartlookAnalytics|flutter_smartlook|UXCam|Glassbox|ContentsquareModule|ContentsquareSDK|AmplitudeSessionReplay|AmplitudeSwiftSessionReplayPlugin|MixpanelSessionReplay|DynatraceSessionReplay)$'
  references:
    - https://developer.apple.com/app-store/review/guidelines/
    - https://amplitude.com/docs/sdks/session-replay/session-replay-ios-plugin
    - https://docs.mixpanel.com/docs/tracking-methods/sdks/swift/swift-replay
    - https://docs.dynatrace.com/docs/observe/digital-experience/session-replay-latest/configure-session-replay-mobile/latest-session-replay-ios

