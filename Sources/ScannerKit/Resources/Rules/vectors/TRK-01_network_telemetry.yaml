- id: TRK-01.appmetrica
  vector: TRK-01
  title: Yandex AppMetrica SDK
  description: |
    Yandex AppMetrica analytics SDK. Forwards device identifiers, sessions and
    events off-device; some integrations also report a "vpn_enabled" flag.
  severity: info
  tracker_ids: [yandex.appmetrica]
  maswe: [MASWE-0068]
  mastg: []
  search:
    - kind: symbol
      pattern: 'AMAAppMetrica|YMMYandexMetrica|YandexMobileMetrica'
    - kind: dylib
      pattern: 'AppMetrica|YandexMobileMetrica'
    - kind: frameworkName
      pattern: 'AppMetrica|YandexMobileMetrica'
  attribution:
    primary_framework: AppMetrica
  references:
    - https://appmetrica.yandex.com/docs/en/sdk/ios/analytics/quick-start

