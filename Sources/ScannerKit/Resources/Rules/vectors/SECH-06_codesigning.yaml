- id: SECH-06.app_group_entitlement
  vector: SECH-06
  title: App Groups entitlement (cross-app data sharing)
  description: |
    application-groups entitlement allows multiple apps from the same publisher to share
    UserDefaults/files (often used to share IDFA / VPN-detected flag between sibling apps).
  severity: info
  maswe: [MASWE-0066]
  mastg: [MASTG-TEST-0362]
  polarity: neutral
  search:
    - kind: entitlement
      pattern: 'application-groups'
  references:
    - https://developer.apple.com/documentation/bundleresources/entitlements/com.apple.security.application-groups

