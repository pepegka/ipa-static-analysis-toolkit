- id: SECH-06.get_task_allow
  vector: SECH-06
  title: get-task-allow entitlement (debuggable binary)
  description: |
    The `get-task-allow` entitlement lets another process attach to and inspect
    the app's task port; i.e. the binary is debuggable. This is expected for
    development builds but should never ship in App Store / production
    distribution; its presence in a release build is a strong re-sign / tampering
    or mis-build indicator.
  severity: high
  maswe: [MASWE-0063]
  mastg: [MASTG-TEST-0261]
  search:
    - kind: entitlement
      pattern: 'get-task-allow'
  mitre: [T1631]

- id: SECH-06.dynamic_codesigning
  vector: SECH-06
  title: dynamic-codesigning entitlement (JIT / RWX memory)
  description: |
    `dynamic-codesigning` permits the app to allocate writable-then-executable
    (RWX/JIT) memory. Restricted to browsers/JS engines; in an ordinary app it
    widens the attack surface for code injection.
  severity: medium
  maswe: [MASWE-0066]
  mastg: [MASTG-TEST-0362]
  search:
    - kind: entitlement
      pattern: 'dynamic-codesigning'

- id: SECH-06.private_entitlements
  vector: SECH-06
  title: Apple private entitlement (com.apple.private.*)
  description: |
    Declares an Apple-private (`com.apple.private.*`) entitlement. App Store apps
    cannot legitimately hold these; their presence indicates a platform/system
    binary or a re-signed/tampered build.
  severity: medium
  maswe: [MASWE-0066]
  mastg: [MASTG-TEST-0362]
  search:
    - kind: entitlement
      pattern: 'com\.apple\.private\.'
  mitre: [T1631]

- id: SECH-06.dynamic_loader_imports
  vector: SECH-06
  title: Dynamic loader in use (dlopen / dlsym)
  description: |
    The binary imports dlopen/dlsym, so it can resolve and call code chosen at
    runtime rather than at link time. That is how optional frameworks, plugin
    architectures and A/B-tested SDKs are loaded, and it is entirely normal, so
    this ships as INFO inventory rather than a weakness. It matters only as
    context: an app that also carries obfuscation (SURV-04) or a data broker
    (TRK-02) can assemble behaviour a static scan cannot see, and dynamic code
    loading is the mechanism that makes that possible.
    Note the limit of the signal: an import proves the symbol is linked, not
    that it is ever called, and iOS forbids loading code that is not already in
    the signed bundle. (MASWE-0049)
  severity: info
  maswe: [MASWE-0049]
  mastg: []
  polarity: neutral
  masvs: [MASVS-CODE]
  search:
    - kind: importedSymbol
      pattern: '^_dlopen$|^_dlsym$'

- id: SECH-06.wifi_info_entitlement
  vector: SECH-06
  title: Access Wi-Fi Information entitlement
  description: |
    Signed with com.apple.developer.networking.wifi-info, which lets the app read information about the connected Wi-Fi network. The network name and BSSID locate a device as precisely as GPS. The entitlement shows the capability
    is granted; whether the app needs it is the question the linked MASTG test poses.
  severity: info
  maswe: [MASWE-0066]
  mastg: [MASTG-TEST-0362]
  polarity: neutral
  search:
    - kind: entitlement
      pattern: '^com\.apple\.developer\.networking\.wifi-info$'
  references:
    - https://developer.apple.com/documentation/bundleresources/entitlements/com.apple.developer.networking.wifi-info

